databases:
  - name: bravo-express-db
    databaseName: bravo_express
    user: bravo_express
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: bravo-express
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: bravo-express-db
          property: connectionString
      - key: APP_URL
        value: https://bravo-express.onrender.com
      - key: ADMIN_USERNAME
        value: staff
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
